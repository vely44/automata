services:
  zeroclaw:
    build:
      context: ./zeroclaw
      dockerfile: Dockerfile
    container_name: zeroclaw
    ports:
      - "${ZEROCLAW_PORT:-8080}:8080"
    volumes:
      - ./zeroclaw/config.toml:/root/.zeroclaw/config.toml:ro
      - ./zeroclaw/workspace:/root/.zeroclaw/workspace
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
  dashbot:
    build:
      context: ./dashbot
      dockerfile: Dockerfile
    container_name: dashbot
    volumes:
      - ./dashbot/data:/app/data
      - ./zeroclaw/config.toml:/app/zeroclaw-config.toml:ro
    environment:
      - DISCORD_BOT_TOKEN=${DASHBOT_TOKEN}
      - ZEROCLAW_URL=http://zeroclaw:8080
    restart: unless-stopped
