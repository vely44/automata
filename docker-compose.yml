services:
  nanobot:
    build:
      context: ./nanobot
      dockerfile: Dockerfile
    container_name: nanobot
    ports:
      - "${NANOBOT_PORT:-8080}:8080"
    volumes:
      - ./nanobot/config.yaml:/app/config.yaml:ro
      - ./nanobot/workspace:/app/workspace
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
  dashbot:
    build:
      context: ./dashbot
      dockerfile: Dockerfile
    container_name: dashbot
    volumes:
      - ./dashbot/data:/app/data
      - ./nanobot/config.yaml:/app/nanobot-config.yaml:ro
    environment:
      - DISCORD_BOT_TOKEN=${DASHBOT_TOKEN}
      - NANOBOT_URL=http://nanobot:8080
    restart: unless-stopped
