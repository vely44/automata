services:
  nanobot:
    build:
      context: ./nanobot
      dockerfile: Dockerfile
    container_name: nanobot
    volumes:
      - ./nanobot/config.yaml:/app/config.yaml:ro
      - ./nanobot/workspace:/app/workspace
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
    restart: unless-stopped
    networks:
      - automata-network

  dashbot:
    build:
      context: ./dashbot
      dockerfile: Dockerfile
    container_name: dashbot
    volumes:
      - ./dashbot/data:/app/data
      - ./nanobot/config.yaml:/app/nanobot-config.yaml:ro
    environment:
      - DISCORD_BOT_TOKEN=${DASHBOT_TOKEN}
    restart: unless-stopped
    networks:
      - automata-network

networks:
  automata-network:
    driver: bridge
