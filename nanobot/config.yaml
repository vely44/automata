# Nanobot Configuration
# =====================
# Ultra-lightweight Python AI agent with Discord support
# Note: Discord token is read from DISCORD_BOT_TOKEN environment variable

# LLM Provider Configuration
# Supported providers: "anthropic", "openai", or any custom provider (e.g., "ollama", "groq")
# For custom providers, set LLM_PROVIDER and LLM_API_KEY environment variables in .env
llm:
  provider: "anthropic"  # "anthropic", "openai", or custom provider name
  model: "claude-sonnet-4-6"
  temperature: 0.7
  max_tokens: 4096

# Discord Channel Configuration
discord:
  enabled: true
  # Token is passed via DISCORD_BOT_TOKEN environment variable
  intents:
    - "message_content"
    - "messages"
    - "guilds"

# Workspace Configuration
workspace:
  path: "/app/workspace"
  auto_save: true

# Memory and State
memory:
  backend: "sqlite"
  db_path: "/app/workspace/memory.db"
  max_history: 100

# Tool/Command Configuration
tools:
  enabled_tools:
    - "bash"
    - "git"
    - "file_operations"
  sandbox_mode: true
  allowed_commands:
    - "git"
    - "npm"
    - "ls"
    - "cat"
    - "grep"
    - "mkdir"
    - "cp"
    - "mv"
  forbidden_paths:
    - "/etc"
    - "/root"
    - "/proc"
    - "/sys"

# Autonomy Settings
autonomy:
  level: "supervised"  # "supervised", "autonomous"
  max_actions_per_hour: 20
  max_cost_per_day_cents: 500

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
